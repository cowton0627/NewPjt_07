name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          xcodebuild test \
            -project StellarAPOD/StellarAPOD.xcodeproj \
            -scheme StellarAPOD \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
